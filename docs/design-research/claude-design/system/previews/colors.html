<!-- @dsCard group="Colors" name="Eight roles" subtitle="Ink, paper, two text tones, rule, surface, needle, verified" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="../tokens.css"></head><body>
<style>.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.sw div{height:56px;border:1px solid var(--rule);border-radius:2px}.sw p{margin:4px 0 0}</style>
<div class="sw">
<div style="background:var(--paper)"></div><div style="background:var(--ink)"></div><div style="background:var(--text-2)"></div><div style="background:var(--text-3)"></div>
<p class="meta">paper</p><p class="meta">ink</p><p class="meta">text-2</p><p class="meta">text-3</p>
<div style="background:var(--rule)"></div><div style="background:var(--surface)"></div><div style="background:var(--needle)"></div><div style="background:var(--verified)"></div>
<p class="meta">rule</p><p class="meta">surface</p><p class="meta">needle: stopped, failed only</p><p class="meta">verified: evidence, live</p>
</div>
<p class="small" style="margin-top:24px">No other colour exists. No gradients, no glows, no tinted text on colour. Dark mode is a second set of the same eight roles, never an inversion.</p>
</body></html>
