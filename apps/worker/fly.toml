# Fly.io app definition for the North worker (ADR 0007). Deploy from the repo root:
#   fly launch --no-deploy --copy-config --config apps/worker/fly.toml   (first time)
#   fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... ANTHROPIC_API_KEY=... \
#                   INNGEST_EVENT_KEY=... INNGEST_SIGNING_KEY=... CONNECTIONS_ENCRYPTION_KEY=...
#   fly deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile
app = "north-worker"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  WORKER_HOST = "0.0.0.0"
  WORKER_PORT = "3101"
  AGENT_RUNTIME = "claude-agent-sdk"
  INTEGRATIONS_MODE = "live"
  WORKSPACE_ROOT = "/data/workspaces"
  SANDBOX_ROOT = "/data/sandbox"

[http_service]
  internal_port = 3101
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      grace_period = "20s"
      interval = "30s"
      method = "GET"
      path = "/health"
      timeout = "5s"

[[mounts]]
  source = "north_workspaces"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
