name: ci

on:
  push:
    branches: [north-ceo-os, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Task 16 ruling: scripts/ is outside the workspace packages, so it has its own strict tsconfig.
      - run: pnpm typecheck:scripts
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm test:scripts
      # TST-2 (M7 Task 18): every committed cassette is a gateway recording with no secret, a key that is its name and the pinned Agent SDK version.
      - run: pnpm cassette:check
      # ADR 0015: the web may read NEXT_PUBLIC_SENTRY_DSN (a public DSN), so SENTRY_DSN is matched only when no `_` precedes it.
      # M6 review L15: every tracked file of apps/web (root configs such as next.config.ts and sentry.*.config.ts
      # included), not only src/. `git grep` reads tracked files only, so build output, reports and local env files
      # never match; the excludes say so explicitly. apps/web/e2e is the Playwright harness on the CI runner: it seeds
      # the local stack with the service role and is never part of the Next build.
      # git grep exits 0 on a match (fail), 1 on none (pass), anything else when it could not run (fail).
      - name: Worker-only secrets never appear in the web app
        run: |
          status=0
          git grep -nE "SUPABASE_SERVICE_ROLE_KEY|GITHUB_CLIENT_SECRET|VERCEL_CLIENT_SECRET|META_APP_SECRET|GOOGLE_CLIENT_SECRET|CONNECTIONS_ENCRYPTION_KEY|SENTRY_CLIENT_SECRET|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|STRIPE_CONNECT_CLIENT_SECRET|LANGFUSE_SECRET_KEY|ANTHROPIC_API_KEY|RESEND_API_KEY|VAPID_PRIVATE_KEY|UNSUBSCRIBE_SECRET|NORTH_TRUST_PROXY|(^|[^_])SENTRY_DSN" -- apps/web ':(exclude)apps/web/e2e' ':(exclude)apps/web/node_modules' ':(exclude)apps/web/.next' ':(exclude)apps/web/playwright-report*' ':(exclude)apps/web/test-results' || status=$?
          [ "$status" -eq 1 ]
      - name: Worker image builds (Fly.io Dockerfile, ADR 0007)
        run: docker build -f apps/worker/Dockerfile -t north-worker:ci .
      - name: Worker image carries no env files, workspaces or sandbox sites
        run: docker run --rm north-worker:ci sh -c '! find /app -name ".env" -o -name ".env.*" ! -name ".env.example" | grep . && ! ls -d /app/apps/worker/.workspaces /app/apps/worker/.sandbox 2>/dev/null'
      # SEC-1 (M7 Task 9): the engineering role's shell runs under the Agent SDK sandbox with failIfUnavailable, which needs bwrap and socat on Linux.
      - name: Worker image carries bubblewrap and socat for the SDK sandbox (SEC-1)
        run: docker run --rm north-worker:ci sh -c 'bwrap --version && socat -V >/dev/null && command -v socat'
      - name: Start local Supabase
        run: pnpm db:start
      - name: Integration tests (RLS, constraints)
        run: pnpm test:integration
        env:
          REQUIRE_INTEGRATION: "1"
      - name: Worker integration test (the purge against the stack, ADR 0016)
        run: |
          eval "$(cd packages/db && npx supabase status -o env | sed -n 's/^API_URL=/export SUPABASE_URL=/p; s/^SERVICE_ROLE_KEY=/export SUPABASE_SERVICE_ROLE_KEY=/p')"
          pnpm --filter @north/worker exec vitest run test/purge.test.ts
        env:
          REQUIRE_INTEGRATION: "1"
      - run: pnpm smoke

  # ADR 0015: the whole proof in CI, sandbox + mock, no hosted service and no key: every smoke (M1–M6) and the Playwright flows.
  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INTEGRATIONS_MODE: sandbox
      AGENT_RUNTIME: mock
      INNGEST_DEV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm db:start
      - name: Env files for the local stack (sandbox + mock; the web gets public values only)
        run: |
          status="$(cd packages/db && npx supabase status -o env)"
          val() { printf '%s\n' "$status" | sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" | head -1; }
          url="$(val API_URL)"; anon="$(val ANON_KEY)"; service="$(val SERVICE_ROLE_KEY)"
          echo "::add-mask::$service"
          printf 'NEXT_PUBLIC_APP_URL=http://localhost:3100\nNEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nINNGEST_DEV=1\nINTEGRATIONS_MODE=sandbox\n' "$url" "$anon" > apps/web/.env.local
          printf 'NEXT_PUBLIC_APP_URL=http://localhost:3100\nSUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nINNGEST_DEV=1\nINTEGRATIONS_MODE=sandbox\nAGENT_RUNTIME=mock\nWORKER_PORT=3101\n' "$url" "$service" > apps/worker/.env
          { echo "SUPABASE_URL=$url"; echo "SUPABASE_ANON_KEY=$anon"; echo "SUPABASE_SERVICE_ROLE_KEY=$service"; } >> "$GITHUB_ENV"
      - name: Start web, worker and the Inngest Dev Server in the background
        run: nohup pnpm dev > dev.log 2>&1 &
      - name: Wait for the three health URLs
        run: |
          for url in http://localhost:3101/health http://localhost:8288 http://localhost:3100/api/health; do
            for _ in $(seq 1 120); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url" || { echo "not up: $url"; tail -n 200 dev.log; exit 1; }
          done
      - run: pnpm --filter @north/web exec playwright install --with-deps chromium
      - name: Validate (typecheck, lint, unit, integration, every smoke M1–M6)
        run: pnpm validate
        env:
          REQUIRE_INTEGRATION: "1"
          REQUIRE_SMOKE_M1: "1"
      - run: pnpm e2e
        env:
          CI: "1"
      # PWA-1: the offline brief needs a production build (the dev server cannot hydrate offline).
      - name: e2e on a production build (offline brief)
        run: pnpm e2e:prod
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-prod
            docs/evidence/M6/ci-*.png
            dev.log

  # TST-2 (M7 Task 17): real Claude on every pull request, on the smoke profile, within $0.50: the worker's gateway
  # caps the UTC day at NORTH_DAILY_CAP_USD=0.50 (one CI process = one run) and `smoke-llm.ts` refuses a worker
  # without that cap. Founder-gated: without the ANTHROPIC_TEST_API_KEY repository secret every step after the first
  # is skipped and the job is green with no spend. Forks get no secrets, so it does not run for them.
  # The key goes into apps/worker/.env only (never echoed, never uploaded); dev.log is printed on failure, not uploaded.
  llm-smoke:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: llm-smoke-${{ github.ref }}
      cancel-in-progress: true
    env:
      INTEGRATIONS_MODE: sandbox
      INNGEST_DEV: "1"
    steps:
      - name: Check for the test key
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_TEST_API_KEY != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then echo "::notice::llm-smoke skipped: the ANTHROPIC_TEST_API_KEY repository secret is not set (the founder adds it, M7 Task 23)"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.present == 'true'
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.key.outputs.present == 'true'
      # SEC-1: the engineering role's shell runs under the Agent SDK sandbox with failIfUnavailable (bwrap + socat);
      # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor, which bwrap needs.
      - name: Bubblewrap and socat for the engineering sandbox (SEC-1)
        if: steps.key.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          bwrap --ro-bind / / --dev /dev --proc /proc true
      - name: Start local Supabase
        if: steps.key.outputs.present == 'true'
        run: pnpm db:start
      - name: Env files for the local stack (sandbox, SDK runtime, smoke profile, $0.50 day cap, recording gateway)
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_TEST_API_KEY: ${{ secrets.ANTHROPIC_TEST_API_KEY }}
        run: |
          status="$(cd packages/db && npx supabase status -o env)"
          val() { printf '%s\n' "$status" | sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" | head -1; }
          url="$(val API_URL)"; anon="$(val ANON_KEY)"; service="$(val SERVICE_ROLE_KEY)"
          echo "::add-mask::$service"
          printf 'NEXT_PUBLIC_APP_URL=http://localhost:3100\nNEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nINNGEST_DEV=1\nINTEGRATIONS_MODE=sandbox\n' "$url" "$anon" > apps/web/.env.local
          printf 'NEXT_PUBLIC_APP_URL=http://localhost:3100\nSUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nINNGEST_DEV=1\nINTEGRATIONS_MODE=sandbox\nWORKER_PORT=3101\n' "$url" "$service" > apps/worker/.env
          printf 'AGENT_RUNTIME=claude-agent-sdk\nNORTH_ENV=staging\nNORTH_MODEL_PROFILE=smoke\nNORTH_DAILY_CAP_USD=0.50\nNORTH_CASSETTE_MODE=record\nNORTH_CASSETTE_DIR=%s\n' "$RUNNER_TEMP/cassettes" >> apps/worker/.env
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_TEST_API_KEY" >> apps/worker/.env
          { echo "SUPABASE_URL=$url"; echo "SUPABASE_ANON_KEY=$anon"; echo "SUPABASE_SERVICE_ROLE_KEY=$service"; } >> "$GITHUB_ENV"
      - name: Start web, worker and the Inngest Dev Server in the background
        if: steps.key.outputs.present == 'true'
        run: nohup pnpm dev > dev.log 2>&1 &
      - name: Wait for the three health URLs
        if: steps.key.outputs.present == 'true'
        run: |
          for url in http://localhost:3101/health http://localhost:8288 http://localhost:3100/api/health; do
            for _ in $(seq 1 120); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url" || { echo "not up: $url"; tail -n 200 dev.log; exit 1; }
          done
      - name: Real-Claude smoke (market report + build, smoke profile, $0.50 cap)
        if: steps.key.outputs.present == 'true'
        env:
          # The pull request's head commit (GITHUB_SHA is the merge commit), recorded in smoke-llm.json.
          SMOKE_LLM_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: SMOKE_LLM_OUT="$RUNNER_TEMP/smoke-llm.json" pnpm smoke:llm -- --runtime claude-agent-sdk
      - name: Dev server log on failure
        if: failure() && steps.key.outputs.present == 'true'
        run: tail -n 300 dev.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: llm-smoke-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/smoke-llm.json
            ${{ runner.temp }}/cassettes

  # TST-2 (M7 Task 18): the guard of `e2e-replay`. `hashFiles` is not allowed in a job-level `if`, so this one-step
  # job reads the directory and `e2e-replay` is skipped (not run, not red) unless a cassette is committed.
  cassettes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.found.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Look for committed cassettes
        id: found
        env:
          HAS_CASSETTES: ${{ hashFiles('cassettes/*.json') != '' }}
        run: |
          echo "present=$HAS_CASSETTES" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CASSETTES" != "true" ]; then echo "::notice::e2e-replay skipped: no cassettes/*.json is committed yet (the nightly job records them, M7 Task 21); the mock e2e job stays the gate"; fi

  # TST-2 (M7 Task 18): the Playwright specs on the SDK runtime with replayed responses: no key, no network to the model
  # API, no spend. Skipped until the nightly job (Task 21) has committed a full set of cassettes; the mock `e2e` job
  # is the gate until then. The cassette check runs first, so a bad file fails before anything starts.
  e2e-replay:
    needs: [validate, cassettes]
    if: needs.cassettes.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTEGRATIONS_MODE: sandbox
      INNGEST_DEV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cassette:check
      # SEC-1: the agent subprocess still runs the engineering sandbox on replay (bwrap + socat; see `llm-smoke`).
      - name: Bubblewrap and socat for the engineering sandbox (SEC-1)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          bwrap --ro-bind / / --dev /dev --proc /proc true
      - name: Start local Supabase
        run: pnpm db:start
      - name: Env files for the local stack (sandbox, SDK runtime, smoke profile, replaying gateway, no model key)
        run: |
          status="$(cd packages/db && npx supabase status -o env)"
          val() { printf '%s\n' "$status" | sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" | head -1; }
          url="$(val API_URL)"; anon="$(val ANON_KEY)"; service="$(val SERVICE_ROLE_KEY)"
          echo "::add-mask::$service"
          printf 'NEXT_PUBLIC_APP_URL=http://localhost:3100\nNEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nINNGEST_DEV=1\nINTEGRATIONS_MODE=sandbox\n' "$url" "$anon" > apps/web/.env.local
          printf 'NEXT_PUBLIC_APP_URL=http://localhost:3100\nSUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nINNGEST_DEV=1\nINTEGRATIONS_MODE=sandbox\nWORKER_PORT=3101\n' "$url" "$service" > apps/worker/.env
          printf 'AGENT_RUNTIME=claude-agent-sdk\nNORTH_ENV=staging\nNORTH_MODEL_PROFILE=smoke\nNORTH_CASSETTE_MODE=replay\n' >> apps/worker/.env
          { echo "SUPABASE_URL=$url"; echo "SUPABASE_ANON_KEY=$anon"; echo "SUPABASE_SERVICE_ROLE_KEY=$service"; } >> "$GITHUB_ENV"
      - name: Start web, worker and the Inngest Dev Server in the background
        run: nohup pnpm dev > dev.log 2>&1 &
      - name: Wait for the three health URLs
        run: |
          for url in http://localhost:3101/health http://localhost:8288 http://localhost:3100/api/health; do
            for _ in $(seq 1 120); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url" || { echo "not up: $url"; tail -n 200 dev.log; exit 1; }
          done
      - run: pnpm --filter @north/web exec playwright install --with-deps chromium
      - run: pnpm e2e:replay
        env:
          CI: "1"
      - name: Dev server log on failure
        if: failure()
        run: tail -n 300 dev.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-replay-report
          retention-days: 7
          if-no-files-found: ignore
          path: apps/web/playwright-report
