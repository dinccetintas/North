name: ci

on:
  push:
    branches: [north-ceo-os, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - name: Start local Supabase
        run: pnpm db:start
      - name: Integration tests (RLS, constraints)
        run: pnpm test:integration
        env:
          REQUIRE_INTEGRATION: "1"
      - run: pnpm smoke
